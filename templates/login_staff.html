{% extends 'base.html' %}
{% block title %}Staff Login{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card shadow-sm">
            <div class="card-body">
                <h3 class="card-title text-center mb-4">Staff Login</h3>
                <form method="POST" action="{{ url_for('auth.gunjan_login_staff') }}">
                    <div class="mb-3">
                        <label class="form-label">Email</label>
                        <input type="email" name="email" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Password</label>
                        <input type="password" name="password" class="form-control" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Login</button>
                </form>
                <p class="text-center mt-3 mb-0">
                    Want to join as staff? <a href="{{ url_for('auth.gunjan_register_staff') }}">Register as Staff</a>
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
