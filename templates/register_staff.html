{% extends 'base.html' %}
{% block title %}Staff Registration{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card shadow-sm">
            <div class="card-body">
                <h3 class="card-title text-center mb-4">Register as Trek Staff</h3>
                <div class="alert alert-info">
                    <small>Your account will need admin approval before you can access the dashboard.</small>
                </div>
                <form method="POST" action="{{ url_for('auth.gunjan_register_staff') }}">
                    <div class="mb-3">
                        <label class="form-label">Full Name</label>
                        <input type="text" name="name" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Email</label>
                        <input type="email" name="email" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Phone</label>
                        <input type="tel" name="phone" class="form-control" minlength="10" maxlength="15" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Password</label>
                        <input type="password" name="password" class="form-control" minlength="6" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Confirm Password</label>
                        <input type="password" name="confirm_password" class="form-control" minlength="6" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Register</button>
                </form>
                <p class="text-center mt-3 mb-0">
                    Already approved? <a href="{{ url_for('auth.gunjan_login_staff') }}">Login</a>
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
