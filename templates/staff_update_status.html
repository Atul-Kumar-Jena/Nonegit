{% extends 'base.html' %}
{% block title %}Update Trek Status{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card shadow-sm">
            <div class="card-body">
                <h3 class="card-title mb-3">Update Status: {{ trek.name }}</h3>
                <p class="text-muted">Current status: <span class="badge bg-info text-dark">{{ trek.status }}</span></p>
                <form method="POST" action="{{ url_for('staff.gunjan_update_trek_status', trek_id=trek.trek_id) }}">
                    <div class="mb-3">
                        <label class="form-label">New Status</label>
                        <select name="status" class="form-select" required>
                            <option value="open" {% if trek.status == 'open' %}selected{% endif %}>Open</option>
                            <option value="closed" {% if trek.status == 'closed' %}selected{% endif %}>Closed</option>
                            <option value="completed" {% if trek.status == 'completed' %}selected{% endif %}>Completed</option>
                        </select>
                    </div>
                    <button type="submit" class="btn btn-primary">Update</button>
                    <a href="{{ url_for('staff.gunjan_view_assigned_treks') }}" class="btn btn-outline-secondary">Cancel</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
