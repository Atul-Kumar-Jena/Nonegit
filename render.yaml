# Attendly API on Render, with the database on Supabase.
# Render dashboard → New → Blueprint → pick this repo and branch → Apply.
# Render then asks for the values marked `sync: false` (see docs/DEPLOY.md):
#
#   DATABASE_URL                 Supabase → Connect → Session pooler (IPv4) connection string
#   DATABASE_SSL_CA              optional but recommended: Supabase → Database → SSL certificate (paste the PEM)
#   BOOTSTRAP_INSTITUTION_NAME   e.g. Green Valley College
#   BOOTSTRAP_ADMIN_EMAIL        the first admin (you) — signs in to Attendly Institute
#   BOOTSTRAP_ADMIN_NAME         e.g. Dr. Anita Rao
#   BOOTSTRAP_DEMO_TEACHER_EMAIL optional demo teacher account (leave empty for none)
#   BOOTSTRAP_DEMO_STUDENT_EMAIL optional demo student account (leave empty for none)
#   BOOTSTRAP_DEVELOPER_EMAIL    optional: YOUR developer account for the Attendly Developer app
#   FCM_SERVICE_ACCOUNT          optional: Firebase service-account JSON → instant push notifications
#
# Demo mode: while OTP_DELIVERY=console (no email provider yet) the server also seeds the
# "Demo Institute of Technology" and its @demo.attendly.app accounts sign in with one tap, no
# code. Real accounts always need a code. Adding SMTP (OTP_DELIVERY=smtp) ends demo mode, or set
# DEMO_INSTANT_LOGIN=false / use the "demo sign-in off" switch in the Developer app.
#
# The institution starts EMPTY apart from those accounts: the admin sets up rooms,
# teachers, courses, students and the timetable from the Institute app.
#
# Sign-in codes: until you add an email provider, OTP_DELIVERY=console shows codes on
# https://<service>.onrender.com/dev?token=<DEV_TOOLS_TOKEN> (copy the token from the
# Environment tab). For real use (docs/PRODUCTION.md): OTP_DELIVERY=brevo (or resend) +
# EMAIL_API_KEY + SMTP_FROM="Attendly <your verified sender>", and delete DEV_TOOLS_TOKEN.
# Email over HTTPS works even where mail ports are blocked; smtp + SMTP_URL is also supported.
# The Developer app's console shows a "Production checklist" with what is still missing.
services:
  - type: web
    name: attendly-api
    runtime: docker
    plan: free
    branch: claude/three-secure-synced-apps-42sdud
    dockerfilePath: ./server/Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_SSL
        value: no-verify
      - key: DATABASE_SSL_CA
        sync: false
      - key: SERVER_SIGNING_KEY
        generateValue: true
      - key: TOKEN_PEPPER
        generateValue: true
      - key: TRUST_PROXY
        value: 'true'
      - key: BOOTSTRAP_INSTITUTION_NAME
        sync: false
      - key: BOOTSTRAP_ADMIN_EMAIL
        sync: false
      - key: BOOTSTRAP_ADMIN_NAME
        sync: false
      - key: BOOTSTRAP_TIMEZONE
        value: Asia/Kolkata
      - key: BOOTSTRAP_DEMO_TEACHER_EMAIL
        sync: false
      - key: BOOTSTRAP_DEMO_STUDENT_EMAIL
        sync: false
      - key: BOOTSTRAP_DEVELOPER_EMAIL
        sync: false
      - key: FCM_SERVICE_ACCOUNT
        sync: false
      - key: OTP_DELIVERY
        value: console
      - key: SMS_DELIVERY
        value: disabled
      - key: DEV_TOOLS_TOKEN
        generateValue: true
      - key: SMTP_URL
        sync: false
      # Optional: every Android phone must prove a security-chip key; only your signed APK may bind.
      - key: REQUIRE_HARDWARE_KEYS
        value: "false"
      - key: ANDROID_APP_CERT_SHA256
        sync: false
      - key: EMAIL_API_KEY
        sync: false
      - key: SMTP_FROM
        sync: false
