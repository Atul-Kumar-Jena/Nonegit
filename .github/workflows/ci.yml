name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Typecheck & tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck (protocol, server, both apps)
        run: npm run typecheck
      - name: Protocol unit tests
        run: npm test -w packages/protocol
      - name: Server integration tests (real PostgreSQL)
        run: npm test -w server
      - name: App kit (server address, signed API client)
        run: npm test -w packages/app-kit
      - name: Institute app units
        run: npm test -w apps/institute
      - name: Server production bundle
        run: npm run build -w server
      - name: Student app JS bundle (Android)
        working-directory: apps/student
        run: npx expo export --platform android --output-dir /tmp/dist-student
      - name: Institute app JS bundle (Android)
        working-directory: apps/institute
        run: npx expo export --platform android --output-dir /tmp/dist-institute
      - name: Developer app JS bundle (Android)
        working-directory: apps/developer
        run: npx expo export --platform android --output-dir /tmp/dist-developer

  docker:
    name: Server Docker image
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f server/Dockerfile -t attendly-api .
      - name: Smoke test the image
        run: |
          docker network create t
          docker run -d --name db --network t -e POSTGRES_PASSWORD=pw postgres:16-alpine
          for i in $(seq 1 30); do docker exec db pg_isready -U postgres && break; sleep 1; done
          KEYS=$(docker run --rm attendly-api node dist/cli.cjs keys | grep -v '^#')
          docker run -d --name api --network t -p 4000:4000 \
            -e DATABASE_URL=postgres://postgres:pw@db:5432/postgres -e OTP_DELIVERY=console \
            $(echo "$KEYS" | sed 's/^/-e /') attendly-api
          for i in $(seq 1 30); do curl -fs localhost:4000/healthz && break; sleep 1; done
          curl -fs localhost:4000/v1/meta
          docker exec api node dist/cli.cjs seed
          docker exec api node dist/cli.cjs audit:verify

  android-apk:
    name: Android APK (${{ matrix.app }})
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        app: [student, institute, developer]
    env:
      # Set these under Settings → Secrets and variables → Actions → Variables.
      EXPO_PUBLIC_API_URL: ${{ vars.ATTENDLY_API_URL }}
      EXPO_PUBLIC_SERVER_KEY: ${{ vars.ATTENDLY_SERVER_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci
      - name: Firebase config (instant push), when the secret is set
        if: matrix.app != 'developer'
        working-directory: apps/${{ matrix.app }}
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: if [ -n "$GOOGLE_SERVICES_JSON" ]; then printf '%s' "$GOOGLE_SERVICES_JSON" > google-services.json && echo "Firebase on"; else echo "Firebase off"; fi
      - name: Generate native Android project
        working-directory: apps/${{ matrix.app }}
        run: npx expo prebuild --platform android --no-install
      # Three CPU types (phones + the emulator check) need more than Gradle's default 2 GB heap.
      - name: Give the Android build more memory
        working-directory: apps/${{ matrix.app }}/android
        run: |
          if grep -q '^org.gradle.jvmargs=' gradle.properties; then
            sed -i 's/^org.gradle.jvmargs=.*/org.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8/' gradle.properties
          else
            echo 'org.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8' >> gradle.properties
          fi
          grep '^org.gradle.jvmargs=' gradle.properties
      # Production signing: your own private key from the repository secrets (see docs/PRODUCTION.md).
      # Without them the APKs are signed with the public debug key — fine for testing only.
      - name: Release signing key, when the secrets are set
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            {
              echo "SIGNING=release"
              echo "SIGN_ARGS=-Pandroid.injected.signing.store.file=$RUNNER_TEMP/release.jks -Pandroid.injected.signing.store.password=$ANDROID_KEYSTORE_PASSWORD -Pandroid.injected.signing.key.alias=${ANDROID_KEY_ALIAS:-attendly} -Pandroid.injected.signing.key.password=${ANDROID_KEY_PASSWORD:-$ANDROID_KEYSTORE_PASSWORD}"
            } >> "$GITHUB_ENV"
            echo "Signing with your release key"
          else
            echo "SIGNING=test" >> "$GITHUB_ENV"
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret: this build is signed with the public debug key (testing only)."
          fi
      - name: Build release APK (and a Play Store bundle when release-signed)
        working-directory: apps/${{ matrix.app }}/android
        run: |
          TASKS="assembleRelease"
          if [ "$SIGNING" = release ]; then TASKS="assembleRelease bundleRelease"; fi
          ./gradlew $TASKS --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a,x86_64 $SIGN_ARGS
      - name: Name the files and show the signing certificate
        run: |
          cp apps/${{ matrix.app }}/android/app/build/outputs/apk/release/app-release.apk attendly-${{ matrix.app }}.apk
          if [ -f apps/${{ matrix.app }}/android/app/build/outputs/bundle/release/app-release.aab ]; then
            cp apps/${{ matrix.app }}/android/app/build/outputs/bundle/release/app-release.aab attendly-${{ matrix.app }}.aab
          fi
          "$ANDROID_HOME"/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner verify --print-certs attendly-${{ matrix.app }}.apk | grep -i "SHA-256" | head -1 || true
      - uses: actions/upload-artifact@v4
        with:
          name: attendly-${{ matrix.app }}-apk
          path: |
            attendly-${{ matrix.app }}.apk
            attendly-${{ matrix.app }}.aab
          if-no-files-found: error
          retention-days: 30

  # Every build is opened on an Android emulator before it is published: an app that crashes on
  # start never reaches a release. (x86_64 is in the APKs so the emulator runs them natively.)
  phone-smoke:
    name: Open the apps on an emulator
    runs-on: ubuntu-latest
    needs: android-apk
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: attendly-*-apk
          merge-multiple: true
      - name: Name the APKs for the test
        run: for a in student institute developer; do mv attendly-$a.apk $a.apk; done
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 31
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash .github/smoke/run.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-results
          path: smoke-out/
          retention-days: 7

  release:
    name: Publish the APKs
    runs-on: ubuntu-latest
    needs: [android-apk, phone-smoke]
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/claude/three-secure-synced-apps-42sdud'
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: attendly-*-apk
          merge-multiple: true
      - name: Zip both apps
        run: zip -9 attendly-apps.zip attendly-student.apk attendly-institute.apk attendly-developer.apk
      # Direct, login-free links that always point at the newest build:
      # https://github.com/<owner>/<repo>/releases/latest/download/attendly-student.apk
      # https://github.com/<owner>/<repo>/releases/latest/download/attendly-institute.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Attendly — test build ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: 'true'
          files: |
            attendly-apps.zip
            attendly-student.apk
            attendly-institute.apk
            attendly-developer.apk
            attendly-*.aab
          body: |
            Test build of the Attendly Android apps, commit ${{ github.sha }}.
            • attendly-apps.zip — all three apps in one zip
            • attendly-student.apk — for students (scan the class QR, see attendance)
            • attendly-institute.apk — for teachers and admins (timetable, classes, QR, register)
            • attendly-developer.apk — for the platform owner (institutions, kill switches, audit, flags)
            Install: open this page on the phone, tap the APK, allow "install unknown apps".
            Signed with a test key — for testing only, not for the Play Store.
