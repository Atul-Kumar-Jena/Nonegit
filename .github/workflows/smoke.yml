# Opens each published APK on an Android emulator and prints what happened: crashes,
# JavaScript errors and the text on screen. Catches "the app won't open" before anyone installs it.
name: Phone smoke test

on:
  workflow_dispatch:
    inputs:
      build:
        description: Release to test (e.g. 36), or "latest"
        default: latest
  push:
    branches: [claude/three-secure-synced-apps-42sdud]
    paths: [.github/workflows/smoke.yml, .github/smoke/**]

jobs:
  smoke:
    name: Open the apps on an emulator
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Download the APKs
        run: |
          B="${{ github.event.inputs.build }}"; [ -z "$B" ] && B=$(cat .github/smoke/build 2>/dev/null || echo latest)
          if [ "$B" = latest ]; then U=https://github.com/${{ github.repository }}/releases/latest/download; else U=https://github.com/${{ github.repository }}/releases/download/build-$B; fi
          for a in student institute developer; do curl -sSfL -o $a.apk $U/attendly-$a.apk; done
          ls -la *.apk
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          # Android 11+ x86_64 images run ARM apps through the built-in translator.
          api-level: 31
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash .github/smoke/run.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-results
          path: smoke-out/
          retention-days: 7
